<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:"Times New Roman",Georgia,serif;background:#fff;padding:24px;width:960px}
 .wrap{display:flex;align-items:center;gap:16px}
 .actor{text-align:center;width:110px;flex-shrink:0}
 .actor svg{display:block;margin:0 auto}
 .actor span{font-size:15px;font-weight:bold}
 .sys{flex:1;border:2px solid #222;border-radius:8px;padding:14px 18px 18px}
 .sys h3{font-size:16px;text-align:center;margin-bottom:12px;letter-spacing:.4px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
 .uc{border:1.5px solid #555;border-radius:60px;padding:7px 16px;font-size:14px;text-align:center;background:#f6f6f6}
 .lines{width:34px;flex-shrink:0}
</style>
<div class="wrap">
  <div class="actor">
    <svg width="60" height="92" viewBox="0 0 60 92">
      <circle cx="30" cy="14" r="12" fill="none" stroke="#222" stroke-width="2"/>
      <line x1="30" y1="26" x2="30" y2="60" stroke="#222" stroke-width="2"/>
      <line x1="8" y1="38" x2="52" y2="38" stroke="#222" stroke-width="2"/>
      <line x1="30" y1="60" x2="12" y2="88" stroke="#222" stroke-width="2"/>
      <line x1="30" y1="60" x2="48" y2="88" stroke="#222" stroke-width="2"/>
    </svg>
    <span>Student</span>
  </div>
  <svg class="lines" height="240" width="34"><line x1="0" y1="120" x2="34" y2="120" stroke="#222" stroke-width="1.5"/></svg>
  <div class="sys">
    <h3>STUDENT ACADEMIC PROGRESS TRACKING SYSTEM</h3>
    <div class="grid">
      <div class="uc">Manage Courses</div>
      <div class="uc">Record Assessment Scores</div>
      <div class="uc">View GPA &amp; Grade Analysis</div>
      <div class="uc">Log Study Sessions</div>
      <div class="uc">Manage Goals &amp; Tasks</div>
      <div class="uc">Study Flashcards</div>
      <div class="uc">Store Documents in Vault</div>
      <div class="uc">View Progress Reports</div>
      <div class="uc">Configure Settings</div>
      <div class="uc">Export / Import Backup</div>
    </div>
  </div>
</div>
